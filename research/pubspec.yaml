name: research
description: "Application mobile de mise en relation entreprises et candidats pour stages et emplois"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  
  # State Management
  provider: ^6.1.1
  
  # HTTP & API
  dio: ^5.4.0
  http: ^1.1.2
  
  # Storage
  shared_preferences: ^2.2.2
  
  # File handling
  file_picker: ^6.1.1
  path_provider: ^2.1.1
  
  # Date formatting
  intl: ^0.19.0
  
  # PDF viewer
  pdf: ^3.10.7
  open_file: ^3.5.2
  
  # Charts and data visualization
  fl_chart: ^0.66.0
  
  # CSV export
  csv: ^5.0.2
  
  # Date picker
  flutter_datetime_picker_plus: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.7
  mocktail: ^1.0.1

flutter:
  uses-material-design: true
